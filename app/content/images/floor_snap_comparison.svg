<svg width="100%" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="snap-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f09595" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="snap-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5dcaa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="340" rx="12" fill="#1e1f22"/>

  <!-- Divider -->
  <line x1="360" y1="20" x2="360" y2="320" stroke="#3e3f45" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== LEFT: Without Snap ==================== -->

  <text x="180" y="32" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0997b">ללא הצמדה לרצפה</text>
  <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">Floor Snap Length = 0</text>

  <!-- Hill slope going up then flat -->
  <path d="M 30 260 L 130 200 L 180 170 L 230 170 L 330 170" stroke="#444441" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fill under the hill for visual clarity -->
  <path d="M 30 260 L 130 200 L 180 170 L 230 170 L 330 170 L 330 280 L 30 280 Z" fill="#2a2a2d" opacity="0.6"/>

  <!-- Player positions walking up the slope -->
  <!-- Position 1: on slope -->
  <circle cx="80" cy="222" r="10" fill="#3c3489" stroke="#534ab7" stroke-width="1.5" opacity="0.3"/>
  <!-- Position 2: on slope -->
  <circle cx="120" cy="196" r="10" fill="#3c3489" stroke="#534ab7" stroke-width="1.5" opacity="0.4"/>
  <!-- Position 3: at the crest — still on ground -->
  <circle cx="160" cy="176" r="10" fill="#3c3489" stroke="#534ab7" stroke-width="1.5" opacity="0.5"/>

  <!-- Position 4: AIRBORNE! floating above the flat part -->
  <circle cx="200" cy="146" r="10" fill="#4a1b0c" stroke="#e24b4a" stroke-width="2"/>

  <!-- Dotted line showing where ground is vs where player is -->
  <line x1="200" y1="156" x2="200" y2="168" stroke="#f09595" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Gap indicator -->
  <text x="215" y="155" font-family="sans-serif" font-size="9" fill="#f09595">רווח!</text>

  <!-- Position 5: falling back down -->
  <circle cx="235" cy="155" r="10" fill="#4a1b0c" stroke="#e24b4a" stroke-width="1.5" opacity="0.5"/>
  <line x1="235" y1="165" x2="235" y2="168" stroke="#f09595" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Position 6: landed back -->
  <circle cx="270" cy="160" r="10" fill="#3c3489" stroke="#534ab7" stroke-width="1.5" opacity="0.4"/>

  <!-- Trajectory arc showing the float -->
  <path d="M 168 172 Q 200 130 240 160" stroke="#f09595" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <!-- Airborne label with arrow -->
  <text x="200" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#f0997b">!השחקן מרחף</text>
  <line x1="200" y1="122" x2="200" y2="136" stroke="#f09595" stroke-width="1.2" marker-end="url(#snap-arrow-red)"/>

  <!-- IsOnFloor() = false badge -->
  <rect x="135" y="85" width="130" height="22" rx="4" fill="#4a1b0c"/>
  <text x="200" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#f0997b">IsOnFloor() = false</text>

  <!-- Direction arrow -->
  <text x="310" y="165" font-family="sans-serif" font-size="11" fill="#5f5e5a">←</text>
  <text x="30" y="275" font-family="sans-serif" font-size="10" fill="#5f5e5a">כיוון תנועה →</text>

  <!-- ==================== RIGHT: With Snap ==================== -->

  <text x="540" y="32" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#5dcaa5">עם הצמדה לרצפה</text>
  <text x="540" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5f5e5a">Floor Snap Length = 6</text>

  <!-- Same hill shape -->
  <path d="M 390 260 L 490 200 L 540 170 L 590 170 L 690 170" stroke="#444441" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fill under the hill -->
  <path d="M 390 260 L 490 200 L 540 170 L 590 170 L 690 170 L 690 280 L 390 280 Z" fill="#2a2a2d" opacity="0.6"/>

  <!-- Player positions — ALL grounded -->
  <!-- Position 1: on slope -->
  <circle cx="440" cy="222" r="10" fill="#085041" stroke="#0f6e56" stroke-width="1.5" opacity="0.3"/>
  <!-- Position 2: on slope -->
  <circle cx="480" cy="196" r="10" fill="#085041" stroke="#0f6e56" stroke-width="1.5" opacity="0.4"/>
  <!-- Position 3: at the crest -->
  <circle cx="520" cy="176" r="10" fill="#085041" stroke="#0f6e56" stroke-width="1.5" opacity="0.5"/>
  <!-- Position 4: ON the flat — snapped down -->
  <circle cx="560" cy="160" r="10" fill="#085041" stroke="#1d9e75" stroke-width="2"/>
  <!-- Position 5: continuing on flat -->
  <circle cx="600" cy="160" r="10" fill="#085041" stroke="#0f6e56" stroke-width="1.5" opacity="0.5"/>
  <!-- Position 6: continuing -->
  <circle cx="640" cy="160" r="10" fill="#085041" stroke="#0f6e56" stroke-width="1.5" opacity="0.3"/>

  <!-- Snap arrow pulling player to ground -->
  <line x1="560" y1="152" x2="560" y2="142" stroke="#5dcaa5" stroke-width="1.2" opacity="0.6"/>
  <line x1="560" y1="142" x2="560" y2="152" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#snap-arrow-green)"/>

  <!-- Snap indicator -->
  <text x="575" y="140" font-family="sans-serif" font-size="9" fill="#5dcaa5">הצמדה ↓</text>

  <!-- Smooth path showing grounded trajectory -->
  <path d="M 528 172 Q 545 168 565 166" stroke="#5dcaa5" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <!-- IsOnFloor() = true badge -->
  <rect x="475" y="85" width="130" height="22" rx="4" fill="#0a3a2c"/>
  <text x="540" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#5dcaa5">IsOnFloor() = true</text>

  <!-- Grounded label -->
  <text x="560" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#5dcaa5">השחקן צמוד לרצפה</text>

  <!-- Direction arrow -->
  <text x="390" y="275" font-family="sans-serif" font-size="10" fill="#5f5e5a">כיוון תנועה →</text>

  <!-- ==================== Bottom explanation ==================== -->

  <rect x="30" y="295" width="660" height="36" rx="6" fill="#2a2a2d"/>
  <text x="360" y="317" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c9c7bc">Floor Snap Length קובע כמה פיקסלים למטה המנוע "ימשוך" את הדמות כדי לשמור אותה על הרצפה</text>

</svg>
