<svg width="100%" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="480" rx="12" fill="#1e1f22"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#c9c7bc" font-family="sans-serif">Movement &amp; Physics 2D</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#5f5e5a" font-family="sans-serif">תנועה ופיזיקה דו-ממדית</text>

  <!-- ======================== -->
  <!-- CharacterBody2D (top-left) - Purple -->
  <!-- ======================== -->
  <rect x="40" y="80" width="340" height="140" rx="10" fill="#2a2555" stroke="#534ab7" stroke-width="1.5"/>
  <!-- Icon: player silhouette -->
  <rect x="60" y="100" width="28" height="36" rx="4" fill="#534ab7" opacity="0.5"/>
  <circle cx="74" cy="93" r="8" fill="#534ab7" opacity="0.5"/>
  <!-- Title -->
  <text x="100" y="112" font-size="15" font-weight="600" fill="#cecbf6" font-family="sans-serif">CharacterBody2D</text>
  <text x="360" y="128" text-anchor="end" font-size="11" fill="#afa9ec" font-family="sans-serif">שליטה ישירה בקוד</text>
  <!-- Properties -->
  <text x="60" y="152" font-size="11" fill="#8a84d0" font-family="monospace">Velocity</text>
  <text x="140" y="152" font-size="11" fill="#5f5e5a" font-family="sans-serif">set speed + direction</text>
  <text x="60" y="170" font-size="11" fill="#8a84d0" font-family="monospace">MoveAndSlide()</text>
  <text x="185" y="170" font-size="11" fill="#5f5e5a" font-family="sans-serif">move + collide + slide</text>
  <text x="60" y="188" font-size="11" fill="#8a84d0" font-family="monospace">IsOnFloor()</text>
  <text x="160" y="188" font-size="11" fill="#5f5e5a" font-family="sans-serif">ground detection</text>
  <text x="360" y="206" text-anchor="end" font-size="11" fill="#5f5e5a" font-family="sans-serif">שחקנים, אויבים, NPCs</text>

  <!-- ======================== -->
  <!-- RigidBody2D (top-right) - Orange -->
  <!-- ======================== -->
  <rect x="420" y="80" width="340" height="140" rx="10" fill="#3d2810" stroke="#b85c1a" stroke-width="1.5"/>
  <!-- Icon: tumbling box -->
  <rect x="440" y="98" width="28" height="28" rx="3" fill="#b85c1a" opacity="0.5" transform="rotate(15 454 112)"/>
  <!-- Title -->
  <text x="480" y="112" font-size="15" font-weight="600" fill="#f0c78a" font-family="sans-serif">RigidBody2D</text>
  <text x="740" y="128" text-anchor="end" font-size="11" fill="#d4a060" font-family="sans-serif">מונע על ידי מנוע הפיזיקה</text>
  <!-- Properties -->
  <text x="440" y="152" font-size="11" fill="#d4a060" font-family="monospace">ApplyImpulse()</text>
  <text x="570" y="152" font-size="11" fill="#5f5e5a" font-family="sans-serif">one-time burst</text>
  <text x="440" y="170" font-size="11" fill="#d4a060" font-family="monospace">ApplyForce()</text>
  <text x="555" y="170" font-size="11" fill="#5f5e5a" font-family="sans-serif">continuous push</text>
  <text x="440" y="188" font-size="11" fill="#d4a060" font-family="monospace">Mass, Bounce</text>
  <text x="560" y="188" font-size="11" fill="#5f5e5a" font-family="sans-serif">physics material</text>
  <text x="740" y="206" text-anchor="end" font-size="11" fill="#5f5e5a" font-family="sans-serif">ארגזים, כדורים, הרס</text>

  <!-- ======================== -->
  <!-- StaticBody2D (bottom-left) - Teal -->
  <!-- ======================== -->
  <rect x="40" y="260" width="340" height="140" rx="10" fill="#0a2e25" stroke="#0f6e56" stroke-width="1.5"/>
  <!-- Icon: wall/floor -->
  <line x1="56" y1="300" x2="88" y2="300" stroke="#0f6e56" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="80" y1="276" x2="80" y2="300" stroke="#0f6e56" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- Title -->
  <text x="100" y="292" font-size="15" font-weight="600" fill="#9fe1cb" font-family="sans-serif">StaticBody2D</text>
  <text x="360" y="308" text-anchor="end" font-size="11" fill="#5dcaa5" font-family="sans-serif">לא זז, חוסם תנועה</text>
  <!-- Properties -->
  <text x="60" y="332" font-size="11" fill="#5dcaa5" font-family="monospace">PhysicsMaterial</text>
  <text x="185" y="332" font-size="11" fill="#5f5e5a" font-family="sans-serif">friction + bounce</text>
  <text x="60" y="350" font-size="11" fill="#5dcaa5" font-family="monospace">ConstantVelocity</text>
  <text x="195" y="350" font-size="11" fill="#5f5e5a" font-family="sans-serif">conveyor belts</text>
  <text x="60" y="368" font-size="11" fill="#5dcaa5" font-family="monospace">AnimatableBody2D</text>
  <text x="205" y="368" font-size="11" fill="#5f5e5a" font-family="sans-serif">moving platforms</text>
  <text x="360" y="386" text-anchor="end" font-size="11" fill="#5f5e5a" font-family="sans-serif">קירות, רצפות, פלטפורמות</text>

  <!-- ======================== -->
  <!-- Area2D (bottom-right) - Blue -->
  <!-- ======================== -->
  <rect x="420" y="260" width="340" height="140" rx="10" fill="#12253d" stroke="#2d5aa0" stroke-width="1.5"/>
  <!-- Icon: dashed detection circle -->
  <circle cx="452" cy="290" r="14" fill="none" stroke="#2d5aa0" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <circle cx="452" cy="290" r="4" fill="#5a9ae0" opacity="0.5"/>
  <!-- Title -->
  <text x="480" y="292" font-size="15" font-weight="600" fill="#a0c4f0" font-family="sans-serif">Area2D</text>
  <text x="740" y="308" text-anchor="end" font-size="11" fill="#6a9fd8" font-family="sans-serif">חיישן — לא חוסם תנועה</text>
  <!-- Properties -->
  <text x="440" y="332" font-size="11" fill="#6a9fd8" font-family="monospace">BodyEntered</text>
  <text x="550" y="332" font-size="11" fill="#5f5e5a" font-family="sans-serif">signal on overlap</text>
  <text x="440" y="350" font-size="11" fill="#6a9fd8" font-family="monospace">GetOverlapping()</text>
  <text x="585" y="350" font-size="11" fill="#5f5e5a" font-family="sans-serif">query bodies</text>
  <text x="440" y="368" font-size="11" fill="#6a9fd8" font-family="monospace">Gravity Override</text>
  <text x="575" y="368" font-size="11" fill="#5f5e5a" font-family="sans-serif">water, wind zones</text>
  <text x="740" y="386" text-anchor="end" font-size="11" fill="#5f5e5a" font-family="sans-serif">מטבעות, אזורי נזק, טריגרים</text>

  <!-- ======================== -->
  <!-- Interaction arrows -->
  <!-- ======================== -->

  <!-- CharacterBody2D ↔ StaticBody2D (collides) -->
  <line x1="160" y1="220" x2="160" y2="260" stroke="#5f5e5a" stroke-width="1.2" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="174" y="244" font-size="10" fill="#5f5e5a" font-family="sans-serif">collides</text>

  <!-- RigidBody2D ↔ StaticBody2D (bounces) -->
  <line x1="540" y1="220" x2="540" y2="260" stroke="#5f5e5a" stroke-width="1.2" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="554" y="244" font-size="10" fill="#5f5e5a" font-family="sans-serif">bounces</text>

  <!-- CharacterBody2D → Area2D (detected by) -->
  <line x1="380" y1="205" x2="420" y2="280" stroke="#2d5aa0" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)" opacity="0.5"/>

  <!-- RigidBody2D → Area2D (detected by) -->
  <line x1="500" y1="220" x2="580" y2="260" stroke="#2d5aa0" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- CharacterBody2D ↔ RigidBody2D (push) -->
  <line x1="380" y1="130" x2="420" y2="130" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-gray)" opacity="0.4"/>

  <!-- ======================== -->
  <!-- Bottom bar: physics concepts -->
  <!-- ======================== -->
  <rect x="40" y="420" width="720" height="44" rx="8" fill="#252528"/>

  <!-- Gravity -->
  <line x1="80" y1="434" x2="80" y2="452" stroke="#e24b4a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="94" y="447" font-size="12" font-weight="500" fill="#c9c7bc" font-family="sans-serif">Gravity</text>
  <text x="148" y="447" font-size="11" fill="#5f5e5a" font-family="sans-serif">כבידה</text>

  <!-- Friction -->
  <line x1="240" y1="443" x2="260" y2="443" stroke="#d4a060" stroke-width="1.5"/>
  <line x1="280" y1="443" x2="260" y2="443" stroke="#d4a060" stroke-width="1.5"/>
  <text x="296" y="447" font-size="12" font-weight="500" fill="#c9c7bc" font-family="sans-serif">Friction</text>
  <text x="352" y="447" font-size="11" fill="#5f5e5a" font-family="sans-serif">חיכוך</text>

  <!-- Bounce -->
  <path d="M460 452 L470 434 L480 452" fill="none" stroke="#5dcaa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="494" y="447" font-size="12" font-weight="500" fill="#c9c7bc" font-family="sans-serif">Bounce</text>
  <text x="550" y="447" font-size="11" fill="#5f5e5a" font-family="sans-serif">קפיצה חזרה</text>

  <!-- Delta -->
  <text x="650" y="440" font-size="12" fill="#8a84d0" font-family="monospace">* delta</text>
  <text x="740" y="454" text-anchor="end" font-size="10" fill="#5f5e5a" font-family="sans-serif">FPS-פריים בלתי תלוי ב</text>

</svg>
